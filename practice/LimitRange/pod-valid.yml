apiVersion: v1
kind: Pod
metadata:
  name: valid-pod
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        cpu: "150m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# This works because:
# CPU > 50m (min OK)
# CPU < 1 core (max OK)
# Memory within limits