apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-big
spec:
  replicas: 10
  selector:
    matchLabels:
      app: app-big
  template:
    metadata:
      labels:
        app: app-big
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: "300m"
            memory: "300Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"